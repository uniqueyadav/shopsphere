spring.config.import=optional:file:.env[.properties],optional:file:shopsphere-backend/.env[.properties]
shopsphere.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
shopsphere.cloudinary.api-key=${CLOUDINARY_API_KEY:}
shopsphere.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
shopsphere.product-image.max-size-bytes=${PRODUCT_IMAGE_MAX_SIZE_BYTES:5242880}
shopsphere.product-image.max-count=${PRODUCT_IMAGE_MAX_COUNT:8}
spring.servlet.multipart.max-file-size=${PRODUCT_IMAGE_MAX_SIZE:5MB}
spring.servlet.multipart.max-request-size=${PRODUCT_IMAGE_MAX_REQUEST_SIZE:50MB}
